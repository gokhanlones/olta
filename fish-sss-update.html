<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish SSS Güncelle</title>
<style>
  body { background:#0A1628; color:#E8F4FD; font-family:-apple-system,sans-serif; padding:20px; }
  h2 { color:#F4A261; margin-bottom:4px; }
  p  { color:#7A9BB5; font-size:.85rem; margin-bottom:20px; }
  button { background:#F4A261; color:#0A1628; border:none; padding:13px; border-radius:10px; font-size:1rem; font-weight:700; width:100%; cursor:pointer; margin-bottom:16px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { background:#1A3A5C; border-radius:8px; padding:10px 14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  .name { font-size:.9rem; font-weight:600; }
  .status { font-size:.75rem; color:#7A9BB5; }
  .ok  { color:#34D399; }
  .err { color:#F87171; }
  .run { color:#60A5FA; }
  #summary { margin-top:16px; text-align:center; font-size:.9rem; color:#34D399; display:none; }
</style>
</head>
<body>
<h2>🌊 OLTA — Fish SSS Güncelle</h2>
<p>27 deniz türüne sssMin / sssMax / sssAvg ekler. Diğer alanlar değişmez.</p>
<button id="btn" onclick="run()">Güncelle (27 tür)</button>
<div id="list"></div>
<div id="summary"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyCkq0NU1Ao8LMZw6WfPvQUO4F_r4-An9-c",
    authDomain: "olta-810ae.firebaseapp.com",
    projectId: "olta-810ae",
    storageBucket: "olta-810ae.firebasestorage.app",
    messagingSenderId: "142251428527",
    appId: "1:142251428527:web:dee8776ee6cde14656225a"
  });
  const db = getFirestore(app);

  const UPDATES = [{"id":"lufer","sssMin":22.1,"sssMax":39.1,"sssAvg":34.7},{"id":"levrek","sssMin":30.4,"sssMax":37.7,"sssAvg":32.2},{"id":"cipura","sssMin":31.7,"sssMax":38.4,"sssAvg":37.6},{"id":"palamut","sssMin":16.0,"sssMax":38.6,"sssAvg":33.6},{"id":"uskumru","sssMin":28.8,"sssMax":37.8,"sssAvg":34.1},{"id":"istavrit","sssMin":7.4,"sssMax":37.8,"sssAvg":33.8},{"id":"barbunya","sssMin":31.1,"sssMax":38.9,"sssAvg":37.2},{"id":"tekir","sssMin":19.1,"sssMax":38.7,"sssAvg":36.5},{"id":"karagoz","sssMin":30.0,"sssMax":39.2,"sssAvg":37.3},{"id":"mercan","sssMin":32.1,"sssMax":39.1,"sssAvg":37.2},{"id":"kefal","sssMin":32.2,"sssMax":36.3,"sssAvg":33.5},{"id":"kolyoz","sssMin":26.4,"sssMax":38.6,"sssAvg":33.6},{"id":"sinagrit","sssMin":36.3,"sssMax":37.7,"sssAvg":37.7},{"id":"kalkan","sssMin":6.3,"sssMax":37.3,"sssAvg":14.5},{"id":"dil","sssMin":8.0,"sssMax":37.6,"sssAvg":32.4},{"id":"pisi","sssMin":16.4,"sssMax":35.5,"sssAvg":34.1},{"id":"mezgit","sssMin":28.8,"sssMax":38.2,"sssAvg":35.1},{"id":"akya","sssMin":17.1,"sssMax":37.7,"sssAvg":31.1},{"id":"sarikuyruk","sssMin":16.0,"sssMax":38.8,"sssAvg":35.1},{"id":"lambuka","sssMin":24.4,"sssMax":38.3,"sssAvg":34.5},{"id":"lagos","sssMin":23.3,"sssMax":38.8,"sssAvg":35.5},{"id":"eskina","sssMin":16.0,"sssMax":36.8,"sssAvg":32.1},{"id":"minekop","sssMin":20.4,"sssMax":39.1,"sssAvg":33.8},{"id":"sargos","sssMin":32.0,"sssMax":39.2,"sssAvg":37.6},{"id":"sarıagiz","sssMin":30.1,"sssMax":38.5,"sssAvg":34.3},{"id":"ahtapot","sssMin":31.4,"sssMax":38.5,"sssAvg":36.6},{"id":"kilic","sssMin":23.3,"sssMax":39.2,"sssAvg":35.1}];

  const list = document.getElementById('list');
  UPDATES.forEach(u => {
    list.insertAdjacentHTML('beforeend', `
      <div class="row">
        <span class="name">${u.id}</span>
        <span class="status" id="st-${u.id}">bekliyor</span>
      </div>`);
  });

  function setSt(id, txt, cls) {
    const el = document.getElementById(`st-${id}`);
    el.textContent = txt;
    el.className = `status ${cls}`;
  }

  window.run = async function() {
    document.getElementById('btn').disabled = true;
    let ok = 0, fail = 0;
    for (const u of UPDATES) {
      setSt(u.id, 'güncelleniyor…', 'run');
      try {
        await updateDoc(doc(db, 'fish', u.id), {
          sssMin: u.sssMin, sssMax: u.sssMax, sssAvg: u.sssAvg
        });
        setSt(u.id, `${u.sssMin}–${u.sssMax} ppt ✓`, 'ok');
        ok++;
      } catch(e) {
        setSt(u.id, 'HATA: ' + e.code, 'err');
        fail++;
      }
      await new Promise(r => setTimeout(r, 100));
    }
    const sum = document.getElementById('summary');
    sum.style.display = 'block';
    sum.textContent = `Tamamlandı: ${ok} başarılı${fail ? ', ' + fail + ' hatalı' : ''} ✓`;
  };
</script>
</body>
</html>
