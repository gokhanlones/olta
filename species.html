<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olta — Balık Türleri</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue-dark:  #0A1628;
      --blue-mid:   #1A3A5C;
      --blue-light: #2E86AB;
      --accent:     #F4A261;
      --white:      #FFFFFF;
      --gray:       #6B7280;
      --muted:      #7A9BB5;
      --red:        #DC2626;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--blue-dark);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .banner {
      background: var(--blue-dark);
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .hamburger {
      background: none; border: none; color: var(--white);
      cursor: pointer; padding: 8px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--white); border-radius: 2px; }
    .banner-title { flex: 1; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: 6px; }
    .banner-placeholder { width: 38px; }

    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; display: none; opacity: 0; transition: opacity 0.3s;
    }
    .sidebar-overlay.open { display: block; opacity: 1; }
    .sidebar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
      background: var(--blue-dark); border-right: 1px solid rgba(255,255,255,0.08);
      z-index: 300; transition: left 0.3s ease; display: flex; flex-direction: column;
    }
    .sidebar.open { left: 0; }
    .sidebar-header { padding: 56px 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-header .logo { font-size: 22px; font-weight: 900; letter-spacing: 4px; }
    .sidebar-header .tagline { font-size: 11px; color: var(--blue-light); letter-spacing: 1px; margin-top: 4px; }
    .sidebar-user { display: flex; align-items: center; gap: 12px; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .sidebar-user .name { font-size: 14px; font-weight: 600; }
    .sidebar-user .email { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .sidebar-menu { flex: 1; padding: 12px 0; }
    .sidebar-item {
      display: flex; align-items: center; padding: 14px 20px;
      cursor: pointer; font-size: 15px; transition: background 0.15s;
      border: none; background: none; color: var(--white); width: 100%; text-align: left;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.06); }
    .sidebar-item.active { color: var(--blue-light); font-weight: 700; }
    .sidebar-bottom { padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); }
    .sidebar-item.logout { color: #F87171; }

    .filter-bar {
      display: flex; gap: 8px; padding: 12px 16px;
      background: var(--blue-dark); border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky; top: 56px; z-index: 99;
    }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2); background: none;
      color: var(--gray); font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active {
      background: var(--blue-light); border-color: var(--blue-light);
      color: var(--white); font-weight: 700;
    }

    .content { flex: 1; padding: 16px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 12px; }
    .loading { text-align: center; padding: 40px; color: var(--gray); }

    /* KART */
    .fish-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 5px 5px 0 0;
      overflow: hidden; cursor: pointer;
      transition: transform 0.15s; position: relative;
    }
    .fish-card:active { transform: scale(0.99); }
    .fish-card img { width: 100%; aspect-ratio: 2 / 1; object-fit: cover; border-radius: 5px 5px 0 0; display: block; }

    /* ROZET */
    .badge {
      position: absolute; top: 50%; transform: translateY(-50%);
      right: 10px; padding: 8px 12px; border-radius: 8px;
      text-align: center; background: rgba(0,0,0,0.65);
    }
    .badge-label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
    .badge-label.serbest { color: #4ADE80; }
    .badge-label.yasak   { color: var(--red); }
    .badge-detail { font-size: 11px; color: var(--white); margin-top: 3px; line-height: 1.4; }
    .badge-detail.dim { color: var(--gray); font-size: 10px; }

    /* ALT BİLGİ */
    .card-info {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: rgba(255,255,255,0.03);
    }
    .card-left { display: flex; flex-direction: column; gap: 0; }
    .card-name { font-size: 15px; font-weight: 700; }

    /* SST */
    .card-sst { margin-top: 5px; display: flex; flex-direction: column; gap: 2px; }
    .card-sst span { font-size: 11px; color: var(--muted); }

    .card-season { font-size: 12px; color: #4ADE80; text-align: right; white-space: nowrap; margin-left: 8px; padding-top: 2px; }
    .card-ban    { font-size: 12px; color: var(--red);   text-align: right; white-space: nowrap; margin-left: 8px; padding-top: 2px; }

    /* BOTTOMBAR */
    .bottombar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 60px; background: var(--blue-dark);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; z-index: 100;
    }
    .bottom-btn { background: none; border: none; color: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 8px; }
    .bottom-btn svg { width: 26px; height: 26px; }
    .profile-btn img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-light); }
  
    /* Alt menü: solda Balık Türleri, ortada Ana Sayfa, sağda Profil */
    .bottombar { display: grid; grid-template-columns: 1fr auto 1fr; }
    .bottombar > :first-child { justify-self: start; }
    .bottombar > :nth-child(2) { justify-self: center; }
    .bottombar > :last-child { justify-self: end; }
    .bottom-btn.active { color: var(--blue-light); }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">OLTA</div>
      <div class="tagline">BALIKÇININ REHBERİ</div>
    </div>
    <div class="sidebar-user">
      <img id="user-photo" src="" alt="" />
      <div>
        <div class="name" id="user-name">...</div>
        <div class="email" id="user-email">...</div>
      </div>
    </div>
    <div class="sidebar-menu">
      <button class="sidebar-item" onclick="window.location.href='home.html'">Ana Sayfa</button>
      <button class="sidebar-item" onclick="window.location.href='regions.html'">Bölgeler</button>
      <button class="sidebar-item" onclick="window.location.href='forecast.html'">Tür Tahmini</button>
      <button class="sidebar-item">Ayarlar</button>
    </div>
    <div class="sidebar-bottom">
      <button class="sidebar-item logout" id="logout-btn">Çıkış Yap</button>
    </div>
  </div>

  <div class="banner">
    <button class="hamburger" onclick="openSidebar()">
      <span></span><span></span><span></span>
    </button>
    <div class="banner-title">OLTA</div>
    <div class="banner-placeholder"></div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">Tümü</button>
    <button class="filter-btn" data-filter="deniz">Deniz</button>
    <button class="filter-btn" data-filter="tatlisu">Tatlısu</button>
  </div>

  <div class="content" id="content">
    <div class="loading">Yükleniyor...</div>
  </div>

  <div class="bottombar">
    <button class="bottom-btn active" aria-label="Balık Türleri">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12c2.5-4 6-6 9.5-6s6 2.6 7.5 6c-1.5 3.4-4 6-7.5 6S4.5 16 2 12z"/>
        <path d="M19 12l3-3.5v7z"/>
        <circle cx="7" cy="11" r="0.8" fill="currentColor"/>
      </svg>
    </button>
    <button class="bottom-btn" onclick="window.location.href='home.html'" aria-label="Ana Sayfa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>
    <button class="bottom-btn profile-btn" onclick="window.location.href='profile.html'" aria-label="Profil">
      <img id="bottom-photo" src="" alt="" />
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkq0NU1Ao8LMZw6WfPvQUO4F_r4-An9-c",
      authDomain: "olta-810ae.firebaseapp.com",
      projectId: "olta-810ae",
      storageBucket: "olta-810ae.firebasestorage.app",
      messagingSenderId: "142251428527",
      appId: "1:142251428527:web:dee8776ee6cde14656225a"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let allFish = [];
    let currentFilter = 'all';
    let fishLoaded = false;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      document.getElementById('user-name').textContent  = user.displayName;
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('user-photo').src         = user.photoURL;
      document.getElementById('bottom-photo').src       = user.photoURL;
      if (!fishLoaded) {
        fishLoaded = true;
        await loadFish();
      }
    });

    async function loadFish() {
      const content = document.getElementById('content');
      try {
        const q = query(collection(db, 'fish'), orderBy('order'));
        const snap = await getDocs(q);
        allFish = [];
        snap.forEach(doc => allFish.push(doc.data()));
        renderFish();
      } catch(e) {
        fishLoaded = false;
        content.innerHTML = `<div class="loading">Hata: ${e.message}</div>`;
      }
    }

    function isBanned(f) {
      if (!f.banStart) return false;
      const now = new Date();
      const year = now.getFullYear();
      const months = {
        'Ocak':1,'Şubat':2,'Mart':3,'Nisan':4,'Mayıs':5,'Haziran':6,
        'Temmuz':7,'Ağustos':8,'Eylül':9,'Ekim':10,'Kasım':11,'Aralık':12
      };
      try {
        const [sd, sm] = f.banStart.split(' ');
        const [ed, em] = f.banEnd.split(' ');
        const start = new Date(year, months[sm]-1, parseInt(sd));
        const end   = new Date(year, months[em]-1, parseInt(ed));
        if (end < start) { return now >= start || now <= end; }
        return now >= start && now <= end;
      } catch { return false; }
    }

    function renderFish() {
      const content = document.getElementById('content');
      content.innerHTML = '';
      const list = currentFilter === 'all'
        ? allFish
        : allFish.filter(f => f.type === currentFilter);

      list.forEach(f => {
        const banned = isBanned(f);
        const card = document.createElement('div');
        card.className = 'fish-card';

        const minLabel = f.minSize ? `Min: ${f.minSize} ${f.minSizeUnit}` : 'Boy yok';
        const maxLabel = f.maxKeep || '-';

        const badge = banned
          ? `<div class="badge">
               <div class="badge-label yasak">YASAK</div>
               <div class="badge-detail">${f.banStart}</div>
               <div class="badge-detail dim">${f.banEnd}</div>
             </div>`
          : `<div class="badge">
               <div class="badge-label serbest">SERBEST</div>
               <div class="badge-detail">${minLabel}</div>
               <div class="badge-detail dim">${maxLabel}</div>
             </div>`;

        const seasonText  = f.banStart ? `${f.banStart} - ${f.banEnd}` : 'Tüm sezon';
        const seasonClass = banned ? 'card-ban' : 'card-season';

        const sstHtml = '';

        card.innerHTML = `
          <img src="${f.image}" alt="${f.name}" />
          ${badge}
          <div class="card-info">
            <div class="card-left">
              <div class="card-name">${f.name}</div>
              ${sstHtml}
            </div>
            <div class="${seasonClass}">${seasonText}</div>
          </div>
        `;
        content.appendChild(card);
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderFish();
      });
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    });

    window.openSidebar = () => {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.add('open');
    };
    window.closeSidebar = () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    };
  </script>
</body>
</html>
