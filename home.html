<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue-dark:  #0A1628;
      --blue-mid:   #1A3A5C;
      --blue-light: #2E86AB;
      --accent:     #F4A261;
      --white:      #FFFFFF;
      --gray:       #6B7280;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--blue-dark); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; }

    .banner { background: var(--blue-dark); display: flex; align-items: center; padding: 0 16px; height: 56px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .hamburger { background: none; border: none; color: var(--white); cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--white); border-radius: 2px; }
    .banner-title { flex: 1; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: 6px; }
    .banner-placeholder { width: 38px; }

    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; opacity: 0; transition: opacity 0.3s; }
    .sidebar-overlay.open { display: block; opacity: 1; }
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--blue-dark); border-right: 1px solid rgba(255,255,255,0.08); z-index: 300; transition: left 0.3s ease; display: flex; flex-direction: column; }
    .sidebar.open { left: 0; }
    .sidebar-header { padding: 56px 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-header .logo { font-size: 22px; font-weight: 900; letter-spacing: 4px; }
    .sidebar-header .tagline { font-size: 11px; color: var(--blue-light); letter-spacing: 1px; margin-top: 4px; }
    .sidebar-user { display: flex; align-items: center; gap: 12px; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .sidebar-user .name { font-size: 14px; font-weight: 600; }
    .sidebar-user .email { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .sidebar-menu { flex: 1; padding: 12px 0; }
    .sidebar-item { display: flex; align-items: center; padding: 14px 20px; cursor: pointer; font-size: 15px; transition: background 0.15s; border: none; background: none; color: var(--white); width: 100%; text-align: left; }
    .sidebar-item:hover { background: rgba(255,255,255,0.06); }
    .sidebar-item.active { color: var(--blue-light); font-weight: 700; }
    .sidebar-bottom { padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); }
    .sidebar-item.logout { color: #F87171; }

    .content { flex: 1; padding: 16px; padding-bottom: 80px; }

    /* ── AKIŞ ─────────────────────────────────────────── */
    .feed { display: flex; flex-direction: column; gap: 14px; max-width: 640px; margin: 0 auto; }
    .feed-empty { color: var(--gray); text-align: center; padding: 40px 16px; font-size: 14px; line-height: 1.5; }
    .post { scroll-margin-top: 66px; background: var(--blue-mid); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; overflow: hidden; }
    .post-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 0; }
    /* OLTA logosu (açılış ekranındaki yazı logosunun küçük hali) */
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blue-dark); border: 1.5px solid var(--blue-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .post-avatar span { color: var(--white); font-size: 9.5px; font-weight: 900; letter-spacing: 1.3px; padding-left: 1.3px; line-height: 1; }
    .post-author { font-size: 14px; font-weight: 700; }
    .post-badge { font-size: 10px; font-weight: 600; color: var(--blue-dark); background: var(--accent); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
    .post-meta { font-size: 12px; color: #9DB4C8; margin-top: 2px; }
    .post-text { padding: 10px 14px 4px; font-size: 14.5px; line-height: 1.5; }
    .post-spots { display: flex; flex-direction: column; gap: 6px; padding: 8px 14px 12px; }
    .spot { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--white); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .spot:active { background: rgba(255,255,255,0.12); }
    .spot .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spot .pct { font-weight: 800; }
    .spot .pct.high { color: #22C55E; } .spot .pct.moderate { color: #EAB308; } .spot .pct.low { color: #EA580C; }
    .spot .go { color: #9DB4C8; font-size: 18px; line-height: 1; }
    .post-actions { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(255,255,255,0.08); }
    .act { display: flex; align-items: center; justify-content: center; gap: 6px; background: none; border: none; color: #C9D8E4; font-size: 13px; padding: 11px 4px; cursor: pointer; }
    .act svg { width: 19px; height: 19px; }
    .act:active { background: rgba(255,255,255,0.06); }
    .act.liked { color: #F87171; }
    .act.liked svg { fill: currentColor; }
    .comments { border-top: 1px solid rgba(255,255,255,0.08); padding: 10px 14px 12px; display: none; }
    .comments.open { display: block; }
    .comment { display: flex; gap: 8px; margin-bottom: 10px; }
    .comment img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,0.1); }
    .comment-body { flex: 1; min-width: 0; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 7px 10px; }
    .comment-name { font-size: 12px; font-weight: 700; }
    .comment-text { font-size: 13.5px; line-height: 1.4; margin-top: 2px; white-space: pre-wrap; word-wrap: break-word; }
    .comment-del { background: none; border: none; color: #F87171; font-size: 11px; cursor: pointer; padding: 2px 0 0; }
    .comments-empty { color: var(--gray); font-size: 13px; margin-bottom: 10px; }
    .comment-form { display: flex; gap: 8px; }
    .comment-form input { flex: 1; min-width: 0; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; color: var(--white); padding: 9px 14px; font-size: 14px; outline: none; }
    .comment-form button { background: var(--blue-light); border: none; border-radius: 18px; color: var(--white); font-weight: 700; padding: 0 14px; cursor: pointer; }
    .comment-form button:disabled { opacity: .5; }
    /* Akış içi banner reklam (standart mobil banner 320×50; şimdilik test) */
    .ad-banner { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .ad-banner .ad-label { align-self: stretch; max-width: 320px; margin: 0 auto; width: 100%; font-size: 10px; color: #9DB4C8; letter-spacing: .5px; }
    .ad-banner .ad-slot { width: 100%; max-width: 320px; height: 50px; border-radius: 6px; overflow: hidden;
      background: linear-gradient(90deg, #F4A261, #E76F51); color: var(--blue-dark);
      display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800; }
    .toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: rgba(10,22,40,0.95); border: 1px solid rgba(255,255,255,0.15); color: var(--white); font-size: 13px; padding: 9px 14px; border-radius: 10px; z-index: 150; display: none; }
    .toast.show { display: block; }



    .bottombar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--blue-dark); border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 100; }
    .bottom-btn { background: none; border: none; color: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 8px; }
    .bottom-btn svg { width: 26px; height: 26px; }
    .profile-btn img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-light); }
  
    /* Alt menü: solda Tür Tahmini, ortada Ana Sayfa, sağda Profil */
    .bottombar { display: grid; grid-template-columns: 1fr auto 1fr; }
    .bottombar > :first-child { justify-self: start; }
    .bottombar > :nth-child(2) { justify-self: center; }
    .bottombar > :last-child { justify-self: end; }
    .bottom-btn.active { color: var(--blue-light); }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">OLTA</div>
      <div class="tagline">BALIKÇININ REHBERİ</div>
    </div>
    <div class="sidebar-user">
      <img id="user-photo" src="" alt="" />
      <div>
        <div class="name" id="user-name">...</div>
        <div class="email" id="user-email">...</div>
      </div>
    </div>
    <div class="sidebar-menu">
      <button class="sidebar-item active">Ana Sayfa</button>
      <button class="sidebar-item" onclick="window.location.href='species.html'">Balık Türleri</button>
      <button class="sidebar-item" onclick="window.location.href='regions.html'">Bölgeler</button>
      <button class="sidebar-item">Ayarlar</button>
    </div>
    <div class="sidebar-bottom">
      <button class="sidebar-item logout" id="logout-btn">Çıkış Yap</button>
    </div>
  </div>

  <div class="banner">
    <button class="hamburger" onclick="openSidebar()">
      <span></span><span></span><span></span>
    </button>
    <div class="banner-title">OLTA</div>
    <div class="banner-placeholder"></div>
  </div>

  <div class="content">
    <div class="feed" id="feed"><div class="feed-empty">Yükleniyor…</div></div>
  </div>
  <div class="toast" id="toast"></div>

  <div class="bottombar">
    <button class="bottom-btn" onclick="window.location.href='forecast.html'" aria-label="Tür Tahmini">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
        <line x1="8" y1="2" x2="8" y2="18"/>
        <line x1="16" y1="6" x2="16" y2="22"/>
      </svg>
    </button>
    <button class="bottom-btn active" aria-label="Ana Sayfa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>
    <button class="bottom-btn profile-btn" onclick="window.location.href='profile.html'" aria-label="Profil">
      <img id="bottom-photo" src="" alt="" />
    </button>
  </div>

  <script type="module">
    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc, setDoc, deleteDoc,
             addDoc, serverTimestamp, getCountFromServer }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app  = initializeApp({
      apiKey: "AIzaSyCkq0NU1Ao8LMZw6WfPvQUO4F_r4-An9-c",
      authDomain: "olta-810ae.firebaseapp.com",
      projectId: "olta-810ae",
      storageBucket: "olta-810ae.firebasestorage.app",
      messagingSenderId: "142251428527",
      appId: "1:142251428527:web:dee8776ee6cde14656225a"
    });
    const auth = getAuth(app);
    const db   = getFirestore(app);
    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      document.getElementById('user-name').textContent   = user.displayName;
      document.getElementById('user-email').textContent  = user.email;
      document.getElementById('user-photo').src          = user.photoURL;
      document.getElementById('bottom-photo').src        = user.photoURL;
      if (!currentUser) { currentUser = user; loadFeed(); }
    });

    // ── AKIŞ ────────────────────────────────────────────────
    const ICON = {
      like:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.3 3.1 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.8 0 5.9 3.8 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>',
      comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1121 12z"/></svg>',
      share:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
    };
    const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const level = s => s >= 75 ? 'high' : s >= 50 ? 'moderate' : s >= 25 ? 'low' : '';
    const spotUrl = (species, sp) => `forecast.html?tur=${encodeURIComponent(species)}&lat=${sp.lat}&lng=${sp.lng}`
      + (sp.cell_lat != null ? `&clat=${sp.cell_lat}&clng=${sp.cell_lng}` : '');
    function fmtDate(iso) {
      const [y, m, d] = (iso || '').split('-').map(Number);
      return y ? `${d} ${MONTHS[m - 1]}` : '';
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ── AKIŞ İÇİ REKLAM: ilki 2. gönderiden sonra, sonra her 3 gönderide bir
    const AD_FIRST_AFTER = 2;
    const AD_EVERY       = 3;
    function isAdSlot(i, total) {
      const n = i + 1;                          // şimdiye kadar gösterilen gönderi sayısı
      if (n >= total) return false;             // akışın sonuna reklam koyma
      return n === AD_FIRST_AFTER || (n > AD_FIRST_AFTER && (n - AD_FIRST_AFTER) % AD_EVERY === 0);
    }
    function renderAd() {
      // Reklam ağı bağlanınca yalnızca .ad-slot içeriği değişecek (320×50 banner)
      const wrap = el('aside', 'ad-banner');
      wrap.setAttribute('aria-label', 'Reklam');
      wrap.appendChild(el('div', 'ad-label', 'Reklam'));
      const slot = el('div', 'ad-slot');
      slot.append(el('span', null, '📢'), el('span', null, 'Test reklamı · 320×50'));
      wrap.appendChild(slot);
      return wrap;
    }

    async function loadFeed() {
      const feedEl = document.getElementById('feed');
      try {
        const snap = await getDocs(query(collection(db, 'feed_posts'), orderBy('createdAt', 'desc'), limit(20)));
        const posts = [];
        snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
        // Aynı gün içindeki gönderiler üretim sırasıyla
        posts.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (a.order ?? 0) - (b.order ?? 0));
        feedEl.innerHTML = '';
        if (!posts.length) {
          feedEl.appendChild(el('div', 'feed-empty', 'Henüz paylaşım yok. Günlük deniz verisi güncellenince ilk gönderiler burada görünecek.'));
          return;
        }
        posts.forEach((p, i) => {
          feedEl.appendChild(renderPost(p));
          if (isAdSlot(i, posts.length)) feedEl.appendChild(renderAd());
        });
        // Profildeki "Etkinliğim"den gelindiyse o gönderiye kaydır
        const target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView({ block: 'start' });
      } catch (e) {
        console.error('Akış yüklenemedi:', e);
        feedEl.innerHTML = '';
        feedEl.appendChild(el('div', 'feed-empty', 'Akış yüklenemedi. Lütfen daha sonra tekrar deneyin.'));
      }
    }

    function renderPost(p) {
      const post = el('article', 'post');
      post.id = 'post-' + p.id;

      const head = el('div', 'post-head');
      const av = el('div', 'post-avatar'); av.appendChild(el('span', null, 'OLTA'));
      const who = el('div');
      const author = el('div', 'post-author', p.author?.name || 'OLTA');
      author.appendChild(el('span', 'post-badge', 'Deniz verisi'));
      who.appendChild(author);
      who.appendChild(el('div', 'post-meta', [fmtDate(p.date), p.species].filter(Boolean).join(' · ')));
      head.append(av, who);
      post.appendChild(head);

      post.appendChild(el('p', 'post-text', p.text || ''));

      const spots = el('div', 'post-spots');
      (p.spots || []).forEach(sp => {
        const a = el('a', 'spot');
        a.href = spotUrl(p.species, sp);
        a.appendChild(el('span', null, '📍'));
        a.appendChild(el('span', 'name', sp.label || sp.place));
        a.appendChild(el('span', 'pct ' + level(sp.score), '%' + sp.score));
        a.appendChild(el('span', 'go', '›'));
        spots.appendChild(a);
      });
      post.appendChild(spots);

      // Beğen / Yorum yap / Paylaş
      const actions = el('div', 'post-actions');
      const likeBtn = el('button', 'act');    likeBtn.innerHTML = ICON.like + '<span>Beğen</span>';
      const comBtn  = el('button', 'act');    comBtn.innerHTML  = ICON.comment + '<span>Yorum</span>';
      const shrBtn  = el('button', 'act');    shrBtn.innerHTML  = ICON.share + '<span>Paylaş</span>';
      actions.append(likeBtn, comBtn, shrBtn);
      post.appendChild(actions);

      const comments = el('div', 'comments');
      post.appendChild(comments);

      setupLike(p, likeBtn);
      setupComments(p, comBtn, comments);
      shrBtn.onclick = () => sharePost(p);
      return post;
    }

    // ── BEĞEN: feed_posts/{id}/likes/{uid}  (kişi başına tek beğeni)
    async function setupLike(p, btn) {
      const likesCol = collection(db, 'feed_posts', p.id, 'likes');
      const myLike   = doc(db, 'feed_posts', p.id, 'likes', currentUser.uid);
      let liked = false, count = 0, busy = false;
      const render = () => {
        btn.classList.toggle('liked', liked);
        btn.querySelector('span').textContent = count ? `${count} Beğeni` : 'Beğen';
      };
      try {
        const [mine, agg] = await Promise.all([getDoc(myLike), getCountFromServer(likesCol)]);
        liked = mine.exists(); count = agg.data().count; render();
      } catch (e) { console.warn('Beğeni okunamadı', e); }
      btn.onclick = async () => {
        if (busy) return; busy = true;
        const was = liked;
        liked = !was; count += liked ? 1 : -1; render();           // anında göster
        try {
          if (liked) await setDoc(myLike, { createdAt: serverTimestamp() });
          else await deleteDoc(myLike);
        } catch (e) {
          liked = was; count += liked ? 1 : -1; render();          // geri al
          toast('Beğeni kaydedilemedi');
        } finally { busy = false; }
      };
    }

    // ── YORUMLAR: feed_posts/{id}/comments/{auto}
    async function setupComments(p, btn, box) {
      const col = collection(db, 'feed_posts', p.id, 'comments');
      let count = 0, loaded = false;
      const label = () => { btn.querySelector('span').textContent = count ? `${count} Yorum` : 'Yorum'; };
      try { count = (await getCountFromServer(col)).data().count; label(); } catch {}

      const list = el('div');
      const form = el('form', 'comment-form');
      const input = el('input'); input.placeholder = 'Yorum yaz…'; input.maxLength = 500;
      const send = el('button', null, 'Gönder'); send.type = 'submit';
      form.append(input, send);
      box.append(list, form);

      const renderComment = (id, c) => {
        const row = el('div', 'comment');
        const img = el('img'); img.alt = ''; if (c.photoURL) img.src = c.photoURL;
        const body = el('div', 'comment-body');
        body.appendChild(el('div', 'comment-name', c.name || 'Balıkçı'));
        body.appendChild(el('div', 'comment-text', c.text || ''));
        if (c.uid === currentUser.uid) {
          const del = el('button', 'comment-del', 'Sil');
          del.onclick = async () => {
            try { await deleteDoc(doc(db, 'feed_posts', p.id, 'comments', id)); row.remove(); count--; label(); emptyCheck(); }
            catch { toast('Yorum silinemedi'); }
          };
          body.appendChild(del);
        }
        row.append(img, body);
        return row;
      };
      const emptyCheck = () => {
        const has = list.querySelector('.comment');
        let e = list.querySelector('.comments-empty');
        if (!has && !e) list.appendChild(el('div', 'comments-empty', 'İlk yorumu sen yaz.'));
        if (has && e) e.remove();
      };

      btn.onclick = async () => {
        box.classList.toggle('open');
        if (!box.classList.contains('open') || loaded) return;
        loaded = true;
        try {
          const snap = await getDocs(query(col, orderBy('createdAt', 'asc'), limit(100)));
          snap.forEach(d => list.appendChild(renderComment(d.id, d.data())));
        } catch (e) { console.warn('Yorumlar okunamadı', e); }
        emptyCheck();
        input.focus();
      };

      form.onsubmit = async ev => {
        ev.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        send.disabled = true;
        const data = { uid: currentUser.uid, name: currentUser.displayName || 'Balıkçı',
                       photoURL: currentUser.photoURL || '', text, createdAt: serverTimestamp() };
        try {
          const ref = await addDoc(col, data);
          list.appendChild(renderComment(ref.id, data));
          input.value = ''; count++; label(); emptyCheck();
        } catch (e) { toast('Yorum gönderilemedi'); }
        finally { send.disabled = false; }
      };
    }

    // ── PAYLAŞ: telefonun paylaşım menüsü; yoksa bağlantıyı kopyala
    async function sharePost(p) {
      const best = (p.spots || [])[0];
      const url  = best ? new URL(spotUrl(p.species, best), location.href).href : location.href;
      const data = { title: `OLTA · ${p.species || ''}`.trim(), text: p.text || '', url };
      try {
        if (navigator.share) { await navigator.share(data); return; }
        await navigator.clipboard.writeText(`${data.text}\n${url}`);
        toast('Bağlantı kopyalandı');
      } catch (e) {
        if (e?.name !== 'AbortError') toast('Paylaşılamadı');
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    });

    window.openSidebar  = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); };
    window.closeSidebar = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); };
  </script>
</body>
</html>
