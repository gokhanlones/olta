<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
  /* Yeni sürüm kontrolü: GitHub Pages sayfaları tarayıcıda ~10 dk önbellekte
     kalıyor. Önbellekteki kopya ile sunucudaki güncel kopya karşılaştırılır;
     farklıysa sayfa bir kez yenilenir. Sürüm numarası tutmak gerekmez. */
  (function () {
    var CHECK_KEY = 'olta-update-checked-at', RELOAD_KEY = 'olta-update-reloaded:';
    var busy = false;
    function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
    function typing() {   // yazı yazılıyorsa yenileme (gönderi/yorum kaybolmasın)
      var a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return true;
      var f = document.querySelectorAll('textarea, input[type=text], input:not([type])');
      for (var i = 0; i < f.length; i++) if (f[i].value) return true;
      return false;
    }
    async function check() {
      if (busy || !window.fetch) return;
      busy = true;
      try {
        var url = location.href.split('#')[0];
        var cached = await (await fetch(url, { cache: 'force-cache' })).text();
        var res = await fetch(url, { cache: 'reload' });   // ağdan al, önbelleği de güncelle
        if (!res.ok) return;
        var fresh = await res.text();
        if (fresh === cached || typing()) return;
        var last = +store(RELOAD_KEY + url) || 0;           // döngü koruması
        if (Date.now() - last < 30000) return;
        store(RELOAD_KEY + url, String(Date.now()));
        location.reload();
      } catch (e) { /* çevrimdışı vb.: sessizce geç */ }
      finally { busy = false; store(CHECK_KEY, String(Date.now())); }
    }
    check();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - (+store(CHECK_KEY) || 0) > 60000) check();
    });
  })();
  </script>
  <title>Olta — Balıkçının Rehberi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue-dark:  #0A1628;
      --blue-mid:   #1A3A5C;
      --blue-light: #2E86AB;
      --accent:     #F4A261;
      --white:      #FFFFFF;
      --gray:       #6B7280;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--blue-dark);
      color: var(--white);
      min-height: 100vh;
    }

    /* SPLASH */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--blue-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease;
    }
    .splash-logo {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 8px;
      color: var(--white);
    }
    .splash-tagline {
      font-size: 13px;
      color: var(--blue-light);
      letter-spacing: 2px;
      margin-top: 8px;
    }
    .splash-dot {
      width: 8px;
      height: 8px;
      background: var(--blue-light);
      border-radius: 50%;
      margin-top: 40px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    /* ANA EKRAN */
    #main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .auth-logo {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 6px;
      margin-bottom: 4px;
    }
    .auth-tagline {
      font-size: 13px;
      color: var(--blue-light);
      letter-spacing: 1px;
      margin-bottom: 40px;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: var(--white);
      color: #1F2937;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-google:hover { transform: translateY(-1px); }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* İNTERNET YOK */
    #no-connection {
      position: fixed;
      inset: 0;
      background: var(--blue-dark);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 9999;
    }
    #no-connection .icon { font-size: 64px; margin-bottom: 20px; }
    #no-connection h2 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    #no-connection p { color: var(--gray); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
    .retry-btn {
      padding: 14px 32px;
      background: var(--blue-light);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- İNTERNET YOK -->
  <div id="no-connection">
    <div class="icon">📡</div>
    <h2>İnternet Bağlantısı Yok</h2>
    <p>Lütfen bağlantını kontrol et ve tekrar dene.</p>
    <button class="retry-btn" onclick="location.reload()">Tekrar Dene</button>
  </div>

  <!-- SPLASH -->
  <div id="splash">
    <div class="splash-logo">OLTA</div>
    <div class="splash-tagline">BALIKÇININ REHBERİ</div>
    <div class="splash-dot"></div>
  </div>

  <!-- GİRİŞ -->
  <div id="main" style="display:none;">
    <div class="auth-card">
      <div class="auth-logo">OLTA</div>
      <div class="auth-tagline">BALIKÇININ REHBERİ</div>

      <button id="google-btn" class="btn-google">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google ile Giriş Yap
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkq0NU1Ao8LMZw6WfPvQUO4F_r4-An9-c",
      authDomain: "olta-810ae.firebaseapp.com",
      projectId: "olta-810ae",
      storageBucket: "olta-810ae.firebasestorage.app",
      messagingSenderId: "142251428527",
      appId: "1:142251428527:web:dee8776ee6cde14656225a"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    if (!navigator.onLine) {
      document.getElementById('no-connection').style.display = 'flex';
    } else {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
          document.getElementById('main').style.display = 'flex';
        }, 500);
      }, 2000);
    }

    window.addEventListener('offline', () => {
      document.getElementById('no-connection').style.display = 'flex';
    });
    window.addEventListener('online', () => location.reload());

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'home.html';
    });

    const btn = document.getElementById('google-btn');
    btn.addEventListener('click', async () => {
      if (!navigator.onLine) { alert('İnternet bağlantısı yok.'); return; }
      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';
      try {
        const result = await signInWithPopup(auth, new GoogleAuthProvider());
        const user   = result.user;
        const ref    = doc(db, 'users', user.uid);
        const snap   = await getDoc(ref);
        if (!snap.exists()) {
          await setDoc(ref, {
            displayName: user.displayName,
            email:       user.email,
            photoURL:    user.photoURL,
            xp: 0, level: 1, totalCatches: 0,
            badges: [], city: '', licenseNo: '',
            createdAt: serverTimestamp()
          });
        }
        window.location.href = 'home.html';
      } catch (e) {
        console.error(e);
        btn.disabled = false;
        btn.textContent = 'Google ile Giriş Yap';
        if (e.code !== 'auth/popup-closed-by-user') alert('Giriş yapılamadı.');
      }
    });
  </script>
</body>
</html>
