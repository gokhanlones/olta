<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olta — Av Bölgeleri</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue-dark: #0A1628; --blue-mid: #1A3A5C;
      --blue-light: #2E86AB; --accent: #F4A261;
      --white: #FFFFFF; --gray: #6B7280; --red: #DC2626;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--blue-dark); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; }
    .banner { background: var(--blue-dark); display: flex; align-items: center; padding: 0 16px; height: 56px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .hamburger { background: none; border: none; color: var(--white); cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--white); border-radius: 2px; }
    .banner-title { flex: 1; text-align: center; font-size: 20px; font-weight: 900; letter-spacing: 6px; }
    .banner-placeholder { width: 38px; }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; opacity: 0; transition: opacity 0.3s; }
    .sidebar-overlay.open { display: block; opacity: 1; }
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--blue-dark); border-right: 1px solid rgba(255,255,255,0.08); z-index: 300; transition: left 0.3s ease; display: flex; flex-direction: column; }
    .sidebar.open { left: 0; }
    .sidebar-header { padding: 56px 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-header .logo { font-size: 22px; font-weight: 900; letter-spacing: 4px; }
    .sidebar-header .tagline { font-size: 11px; color: var(--blue-light); letter-spacing: 1px; margin-top: 4px; }
    .sidebar-user { display: flex; align-items: center; gap: 12px; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .sidebar-user .name { font-size: 14px; font-weight: 600; }
    .sidebar-user .email { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .sidebar-menu { flex: 1; padding: 12px 0; }
    .sidebar-item { display: flex; align-items: center; padding: 14px 20px; cursor: pointer; font-size: 15px; transition: background 0.15s; border: none; background: none; color: var(--white); width: 100%; text-align: left; }
    .sidebar-item:hover { background: rgba(255,255,255,0.06); }
    .sidebar-item.active { color: var(--blue-light); font-weight: 700; }
    .sidebar-bottom { padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); }
    .sidebar-item.logout { color: #F87171; }

    /* ARAMA */
    .search-bar { padding: 10px 16px; background: var(--blue-dark); border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 56px; z-index: 99; }
    .search-bar input { width: 100%; background: var(--blue-mid); border: none; border-radius: 8px; padding: 9px 14px; color: var(--white); font-size: 14px; outline: none; }
    .search-bar input::placeholder { color: var(--gray); }

    .content { flex: 1; padding: 12px 16px 80px; display: flex; flex-direction: column; gap: 10px; }
    .loading { text-align: center; padding: 40px; color: var(--gray); }

    /* KART */
    .region-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .region-header { display: flex; justify-content: space-between; align-items: center; }
    .region-name { font-size: 17px; font-weight: 700; }
    .region-group { font-size: 11px; font-weight: 700; background: var(--blue-mid); color: var(--blue-light); padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
    .region-ban { font-size: 13px; color: var(--accent); }
    .region-species { font-size: 12px; color: #9CA3AF; line-height: 1.5; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }

    /* BOTTOMBAR */
    .bottombar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--blue-dark); border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 100; }
    .bottom-btn { background: none; border: none; color: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 8px; }
    .bottom-btn svg { width: 26px; height: 26px; }
    .profile-btn img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-light); }
  
    /* Alt menü: solda Tür Tahmini, ortada Ana Sayfa, sağda Profil */
    .bottombar { display: grid; grid-template-columns: 1fr auto 1fr; }
    .bottombar > :first-child { justify-self: start; }
    .bottombar > :nth-child(2) { justify-self: center; }
    .bottombar > :last-child { justify-self: end; }
    .bottom-btn.active { color: var(--blue-light); }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">OLTA</div>
      <div class="tagline">BALIKÇININ REHBERİ</div>
    </div>
    <div class="sidebar-user">
      <img id="user-photo" src="" alt=""/>
      <div>
        <div class="name" id="user-name">...</div>
        <div class="email" id="user-email">...</div>
      </div>
    </div>
    <div class="sidebar-menu">
      <button class="sidebar-item" onclick="window.location.href='home.html'">Ana Sayfa</button>
      <button class="sidebar-item" onclick="window.location.href='species.html'">Balık Türleri</button>
      <button class="sidebar-item active">Bölgeler</button>
      <button class="sidebar-item">Ayarlar</button>
    </div>
    <div class="sidebar-bottom">
      <button class="sidebar-item logout" id="logout-btn">Çıkış Yap</button>
    </div>
  </div>

  <div class="banner">
    <button class="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
    <div class="banner-title">OLTA</div>
    <div class="banner-placeholder"></div>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="İl ara..." oninput="filterRegions()" />
  </div>

  <div class="content" id="content">
    <div class="loading">Bölgeler yükleniyor...</div>
  </div>

  <div class="bottombar">
    <button class="bottom-btn" onclick="window.location.href='forecast.html'" aria-label="Tür Tahmini">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
        <line x1="8" y1="2" x2="8" y2="18"/>
        <line x1="16" y1="6" x2="16" y2="22"/>
      </svg>
    </button>
    <button class="bottom-btn" onclick="window.location.href='home.html'" aria-label="Ana Sayfa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>
    <button class="bottom-btn profile-btn" onclick="window.location.href='profile.html'" aria-label="Profil">
      <img id="bottom-photo" src="" alt=""/>
    </button>
  </div>

  <script type="module">
    import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app  = initializeApp({
      apiKey: "AIzaSyCkq0NU1Ao8LMZw6WfPvQUO4F_r4-An9-c",
      authDomain: "olta-810ae.firebaseapp.com",
      projectId: "olta-810ae",
      storageBucket: "olta-810ae.firebasestorage.app",
      messagingSenderId: "142251428527",
      appId: "1:142251428527:web:dee8776ee6cde14656225a"
    });
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let allRegions = [];

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = 'index.html'; return; }
      document.getElementById('user-name').textContent  = user.displayName || 'Balıkçı';
      document.getElementById('user-email').textContent = user.email || '';
      if (user.photoURL) {
        document.getElementById('user-photo').src  = user.photoURL;
        document.getElementById('bottom-photo').src = user.photoURL;
      }
      await loadRegions();
    });

    async function loadRegions() {
      const content = document.getElementById('content');
      try {
        const q    = query(collection(db, 'regions'), orderBy('name'));
        const snap = await getDocs(q);
        allRegions = [];
        snap.forEach(d => allRegions.push(d.data()));
        renderRegions(allRegions);
      } catch(e) {
        content.innerHTML = `<div class="loading">Hata: ${e.message}</div>`;
      }
    }

    function renderRegions(list) {
      const content = document.getElementById('content');
      content.innerHTML = '';
      if (!list.length) {
        content.innerHTML = '<div class="loading">Sonuç bulunamadı.</div>';
        return;
      }
      list.forEach(r => {
        const div = document.createElement('div');
        div.className = 'region-card';
        div.innerHTML = `
          <div class="region-header">
            <span class="region-name">${r.name}</span>
            <span class="region-group">${r.group}. Grup</span>
          </div>
          <div class="region-ban">🚫 ${r.banPeriod}</div>
          <div class="region-species">${r.species ? r.species.join(', ') : ''}</div>
        `;
        content.appendChild(div);
      });
    }

    window.filterRegions = function() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const filtered = q
        ? allRegions.filter(r => r.name.toLowerCase().includes(q))
        : allRegions;
      renderRegions(filtered);
    };

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    });

    window.openSidebar  = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); };
    window.closeSidebar = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); };
  </script>
</body>
</html>
